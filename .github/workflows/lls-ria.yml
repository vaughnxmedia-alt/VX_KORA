name: LLS Revenue Intelligence Fallback

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "17 5 * * *"
    - cron: "27 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "RIA mode to run"
        required: false
        default: "hourly_scoring"

jobs:
  run-ria:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve RIA mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H%M)" = "0627" ]; then
            echo "mode=weekly_memory_batch" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%H%M)" = "0517" ]; then
            echo "mode=daily_insights" >> "$GITHUB_OUTPUT"
          else
            echo "mode=hourly_scoring" >> "$GITHUB_OUTPUT"
          fi

      - name: Check RIA secrets
        id: secrets
        run: |
          if [ -z "$LLS_RIA_FUNCTION_URL" ]; then
            echo "::notice::LLS_RIA_FUNCTION_URL is not configured. Skipping RIA fallback without failing the workflow."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          LLS_RIA_FUNCTION_URL: ${{ secrets.LLS_RIA_FUNCTION_URL }}

      - name: Invoke revenue-intelligence-run
        if: steps.secrets.outputs.configured == 'true'
        run: |
          headers=(--header "Content-Type: application/json")
          if [ -n "$LLS_RIA_SHARED_SECRET" ]; then
            headers+=(--header "x-lls-ria-secret: $LLS_RIA_SHARED_SECRET")
          fi

          response_file="$(mktemp)"
          http_status="$(
            curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "$LLS_RIA_FUNCTION_URL" \
            "${headers[@]}" \
            --data "{\"mode\":\"${{ steps.mode.outputs.mode }}\"}"
          )"

          echo "RIA HTTP status: $http_status"
          cat "$response_file"
          echo

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "::warning::RIA fallback returned HTTP $http_status. The scheduled workflow will not fail to avoid noisy alert emails."
          fi
        env:
          LLS_RIA_FUNCTION_URL: ${{ secrets.LLS_RIA_FUNCTION_URL }}
          LLS_RIA_SHARED_SECRET: ${{ secrets.LLS_RIA_SHARED_SECRET }}
