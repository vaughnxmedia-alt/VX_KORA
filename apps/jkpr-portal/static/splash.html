<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JahKnowsPR Portal</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        color: #0a1a35;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      .logo {
        width: 140px;
        height: 140px;
      }
      .sub {
        margin-top: 28px;
        font-size: 14px;
        color: #64748b;
        letter-spacing: 0.02em;
      }
      .pulse {
        margin-top: 20px;
        width: 36px;
        height: 36px;
        border: 3px solid #e2e8f0;
        border-top-color: #0a1a35;
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="./logo.svg" alt="JahKnowsPR" width="140" height="140" />
      <p class="sub">Opening your portal…</p>
      <div class="pulse" aria-hidden="true"></div>
    </div>
  </body>
</html>
