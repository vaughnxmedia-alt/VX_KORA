name: Question
description: Ask a question about KORA Engineering Agent
labels: ['type/question', 'status/need-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this question form! Search **this repository’s Issues** first. For upstream-only topics, see [ByteDance trae-agent issues](https://github.com/bytedance/trae-agent/issues).

  - type: textarea
    id: description
    attributes:
      label: What is your question?
      description: A clear and concise description of the question.
    validations:
      required: true

  - type: textarea
    id: additional-info
    attributes:
      label: Additional information that you believe is relevant to this question
      description: Add any other context about the question here.
    validations:
      required: false
